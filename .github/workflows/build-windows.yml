name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'src/**', 'addons/**', 'NodeScope.sln', '.github/workflows/build-windows.yml' ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained EXE
        run: dotnet publish .\src\NodeScope\NodeScope.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\artifacts\win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: NodeScope-win-x64
          path: .\artifacts\win-x64\NodeScope.exe
